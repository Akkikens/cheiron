[project]
name = "cheiron"
version = "0.1.0"
description = "Natural-language questions about clinical trials in; cited visualization specs out."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx[http2]>=0.27",
    "cachetools>=5.5",
    "openai>=1.54",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-cachetools>=5.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Snippets in SPEC.md / docs are illustrative pseudo-code with deliberate alignment.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Country names are upstream's own spellings, curly apostrophes and all. The key must match what
# ClinicalTrials.gov returns byte for byte, so an "ambiguous character" here is the point.
"app/render/countries.py" = ["RUF001"]
"scripts/build_country_map.py" = ["RUF001"]
"tests/unit/test_countries_and_demo.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "app.*"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
